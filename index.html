<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="%DESCRIPTION%" />
    <meta name="theme-color" content="#1d1f21" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="%URL%" />
    <title>%TITLE%</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%URL%" />
    <meta property="og:site_name" content="Vnua Industries" />
    <meta property="og:title" content="%TITLE%" />
    <meta property="og:description" content="%DESCRIPTION%" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:url" content="%URL%" />
    <meta property="twitter:title" content="%TITLE%" />
    <meta property="twitter:description" content="%DESCRIPTION%" />

    <!-- Fonts: Tinos (free, metric-compatible with Times New Roman) for text; Cousine (its Courier New counterpart)
         for revision IDs, labels and dimensions. SIL Open Font License; served from /fonts with the license files. -->
    <link rel="preload" href="/fonts/tinos-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/tinos-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <link rel="stylesheet" href="/src/styles.css" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Vnua Industries",
        "url": "https://www.adrielv.me/",
        "founder": { "@type": "Person", "name": "Adriel Ventura" },
        "email": "adriel@adrielv.me"
      }
    </script>
  </head>
  <body class="font-sans antialiased">
    <!--app-html-->
  </body>
</html>
